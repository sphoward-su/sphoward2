<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spencer Howard</title>
  <style>
    body {
      margin: 0;
      padding: 48px 24px;
      background-color: #ff1177;
      color: #1b0610;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 4.5rem;
      color: #f37d08;
    }

    img {
      display: block;
      margin: 0 auto 32px;
      width: 200px;
      height: 300px;
      object-fit: cover;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    .bio {
      margin: 0;
      font-size: 1.125rem;
    }

    .bio span {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Spencer Howard</h1>

  <img src="me.jpeg" alt="Portrait of Spencer Howard" width="200" height="300">

  <h2>About Me</h2>
  <p class="bio">
    <span>I'm a student who loves building things for the web.</span>
    <span>When I'm not coding, you'll find me exploring new music.</span>
    <span>Always curious, always learning something new.</span>
  </p>
</body>
</html>
